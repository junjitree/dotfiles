# Per-machine GPU environment. Seeded once by krypt, then hand-edited.
# Sourced unconditionally from hyprland.conf, so this file must exist on every
# machine — leave it empty on non-NVIDIA boxes.
#
# On an NVIDIA box, uncomment:
#
# env = LIBVA_DRIVER_NAME,nvidia
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = GBM_BACKEND,nvidia-drm
# env = NVD_BACKEND,direct
# env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Chromium launch flags. Seeded once by krypt, then hand-edited per machine —
# chromium-flags.conf has no include mechanism, so GPU flags cannot live in a
# separate file the way hypr/mpv overrides do.
#
# On an NVIDIA box, hardware video decode needs roughly:
#
#   --enable-features=UseOzonePlatform,AcceleratedVideoDecodeLinuxGL,VaapiOnNvidiaGPUs
#   --ignore-gpu-blocklist
#   --use-gl=angle
#   --use-angle=gl
#
--oauth2-client-id=77185425430.apps.googleusercontent.com
--oauth2-client-secret=OTJgUOQcT7lO7GsGZq2G4IlT
--enable-features=UseOzonePlatform
--ozone-platform=wayland

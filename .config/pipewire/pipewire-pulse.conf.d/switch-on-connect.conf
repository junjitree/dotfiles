# Make a newly connected output the default, and fall back when it goes away.
#
# WirePlumber on its own just picks the sink with the highest priority.session.
# A Bluetooth sink is fixed at 1010, which beats onboard audio (1000 and a bit)
# but not anything on the USB bus, which gets +100 — so headphones took over on
# a laptop and never did on a machine with a USB interface. PulseAudio loaded
# this module by default; pipewire-pulse ships it commented out. Arrays in
# conf.d files are appended to, so this adds to the stock pulse.cmd list.
pulse.cmd = [
    { cmd = "load-module" args = "module-switch-on-connect" }
]
